# The core's whole suite on GitHub's runners, from source. This branch holds
# only the harness. A run is asked for by pushing an EMPTY commit here whose
# first line is `suite <commit>`: the tree under test is that commit of this
# repository (any pushed branch); igropyr is pinned beside it. See README.md. Chez Scheme is built from its release source and cached.
# Each not-green fixture is run again alone, as evidence for classifying it.
# Nothing is written back; no secrets.
name: suite

on:
  push:
    branches: [ci]

permissions:
  contents: read

env:
  CHEZ_VERSION: 10.4.1
  IGROPYR_REV: 1ef294c261121e6f98c8e8f500c90ac2aae5edc9

jobs:
  suite:
    # A push that is not a request (a change to the harness itself) runs
    # nothing, rather than failing.
    if: startsWith(github.event.head_commit.message, 'suite ')
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      # THE COMMIT UNDER TEST comes from the pushed commit's first line. It
      # is taken through the environment and must be a bare hex id, so the
      # message is never interpreted by the shell.
      - name: the tree under test
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          first=$(printf '%s\n' "$MESSAGE" | head -1)
          ref=$(printf '%s\n' "$first" | sed -n -E 's/^suite ([0-9a-f]{40})( .*)?$/\1/p')
          [ -n "$ref" ] || { echo "the commit's first line is not 'suite <full 40-character commit id>': a short id cannot be fetched; nothing to run"; exit 1; }
          echo "REF=$ref" >> "$GITHUB_ENV"; echo "under test: $ref"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
          path: lib/theourgia
      # A LANDING EMPTIES THE GUARD'S EXPECTATIONS. The change-stream guard
      # compares a tree with its base and requires every answer the tree's
      # change alters to be listed in test/change-stream-guard-expect.sexp;
      # once a change lands, the next base holds it, so the file on master
      # must be (). A commit on master with a non-empty file is a landing
      # that did not empty it, and this job refuses it. A branch under test
      # lists what it changes: its entries are printed, not refused. Asked
      # here, before the tree's .git is removed, from master's history.
      - name: the change-stream guard's expectations, empty on master
        working-directory: lib/theourgia
        run: |
          f=test/change-stream-guard-expect.sexp
          [ -f "$f" ] || { echo "no $f in this tree: nothing to check"; exit 0; }
          body=$(grep -v '^[[:space:]]*;' "$f" | tr -d ' \t\r\n')
          git fetch -q --no-tags origin master
          if git merge-base --is-ancestor "$REF" FETCH_HEAD; then on=master; else on=branch; fi
          if [ "$body" = "()" ]; then echo "guard expectations: () ($on)"; exit 0; fi
          echo "guard expectations not empty ($on):"
          grep -v '^[[:space:]]*;' "$f"
          if [ "$on" = master ]; then
            echo "a commit on master carries a non-empty $f: the landing that put its entries there did not empty it"
            exit 1
          fi
          echo "not on master: a branch lists the answers it changes; a reading, not a refusal"
      - uses: actions/checkout@v4
        with:
          repository: guenchi/Igropyr
          ref: ${{ env.IGROPYR_REV }}
          path: lib/igropyr
      - name: libuv and OpenSSL
        run: brew install libuv openssl@3
      - name: Chez Scheme, cached
        id: chez
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/chez-prefix
          key: chez-${{ env.CHEZ_VERSION }}-${{ matrix.runner }}-${{ runner.arch }}
      - name: Chez Scheme ${{ env.CHEZ_VERSION }}, built
        if: steps.chez.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL "https://github.com/cisco/ChezScheme/releases/download/v${CHEZ_VERSION}/csv${CHEZ_VERSION}.tar.gz" | tar -xz
          cd "csv${CHEZ_VERSION}"
          ./configure --threads --disable-x11 --disable-curses --installprefix="$RUNNER_TEMP/chez-prefix" > "$RUNNER_TEMP/chez-configure.log"
          make -j"$(getconf _NPROCESSORS_ONLN)" > "$RUNNER_TEMP/chez-make.log" 2>&1
          make install > "$RUNNER_TEMP/chez-install.log" 2>&1
      - name: what this run is on
        run: |
          echo "$RUNNER_TEMP/chez-prefix/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/chez-prefix/bin:$PATH"
          uname -a; sw_vers; sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          scheme --version
          echo '(display (machine-type))' | scheme -q; echo
          git -C lib/theourgia rev-parse HEAD
          git -C lib/igropyr rev-parse HEAD
          rm -rf lib/theourgia/.git lib/igropyr/.git lib/theourgia/.github
          echo "so files: $(find lib -name '*.so' | wc -l)"
      - name: the whole suite
        run: |
          set +e
          W="$PWD"; mkdir -p "$W/out" "$W/testroot"
          date '+suite start %H:%M:%S'
          cd lib/theourgia/test
          # THE KNOWN-RED LIST GOES TO THE RUNNER TOO: a listed fixture's row
          # count that differs from the table is a reading there, not a refusal.
          ( export THEOURGIA_LIBDIR="$W/lib" THEOURGIA_TEST_ROOT="$W/testroot" THEOURGIA_KNOWN_RED="$W/harness/known-red.txt"; . ./env.sh
            sh run-fixtures.sh "$W/out" > "$W/suite.log" 2>&1; echo $? > "$W/suite.rc" ) || true
          cd "$W"
          date '+suite end %H:%M:%S'
          echo "suite rc: $(cat suite.rc)"
          tail -60 suite.log
          # EACH NOT-GREEN FIXTURE AGAIN, ALONE: fresh roots, a 900 s limit,
          # outside the runner. Evidence for the classification, not the
          # classification itself.
          mkdir -p "$W/rerun"
          for fx in $(grep '^RED ' suite.log | awk '{print $2}'); do
            f="$W/lib/theourgia/test/$fx.sc"; runner="scheme --script"
            [ -f "$f" ] || { f="$W/lib/theourgia/test/$fx.py"; runner="python3"; }
            root=$(mktemp -d "$W/testroot/rerun.XXXXXX"); sock=$(mktemp -d /tmp/ths.XXXXXX)
            ( cd "$W/lib/theourgia/test"; export THEOURGIA_LIBDIR="$W/lib" THEOURGIA_TEST_ROOT="$root" THEOURGIA_TEST_SOCK="$sock"; . ./env.sh
              perl -e 'alarm 900; exec @ARGV' $runner "$f" > "$W/rerun/$fx.out" 2>&1 < /dev/null; echo $? > "$W/rerun/$fx.rc" ) || true
            echo "rerun $fx rc=$(cat "$W/rerun/$fx.rc") fail=$(grep -c '^FAIL' "$W/rerun/$fx.out") mismatch=$(grep -c 'MISMATCH' "$W/rerun/$fx.out") exception=$(grep -c -i 'exception' "$W/rerun/$fx.out") sentinel=$(grep -c "^$fx complete" "$W/rerun/$fx.out")"
          done
          # THE SUITE MUST HAVE RUN TO ITS END: a run that stopped before its
          # summary has no RED lines to rerun and would otherwise read clean.
          grep -q 'fixtures run:' suite.log || { echo "the suite printed no summary: it did not run to its end"; exit 1; }
          # THE VERDICT: a not-green fixture is KNOWN when every hard line of
          # its suite output matches its line in harness/known-red.txt; any
          # other not-green fixture, or a known one with another hard line,
          # is the tree's. Known rows are judged on the development machine.
          unexpected=0; : > verdict.txt
          for fx in $(grep '^RED ' suite.log | awk '{print $2}'); do
            pat=$(awk -F'\t' -v f="$fx" '$1==f {print $2}' harness/known-red.txt)
            hard=$(grep -E '^FAIL|MISMATCH|Exception' "out/$fx.out" || true)
            if [ -z "$pat" ]; then
              echo "UNEXPECTED $fx: not in known-red.txt; alone it answered rc $(cat "rerun/$fx.rc" 2>/dev/null || echo ?)" >> verdict.txt
              printf '%s\n' "$hard" | cut -c1-200 >> verdict.txt; unexpected=$((unexpected+1))
            elif [ -z "$hard" ]; then
              echo "UNEXPECTED $fx: red with no hard line (rc, sentinel or counters)" >> verdict.txt; unexpected=$((unexpected+1))
            elif printf '%s\n' "$hard" | grep -v -E "$pat" > /dev/null; then
              echo "UNEXPECTED $fx: a hard line outside its known class:" >> verdict.txt
              printf '%s\n' "$hard" | grep -v -E "$pat" | cut -c1-200 >> verdict.txt; unexpected=$((unexpected+1))
            else
              echo "known $fx: $(printf '%s\n' "$hard" | wc -l | tr -d ' ') hard line(s), all in its class; judge it on the development machine" >> verdict.txt
            fi
          done
          # A ROW COUNT THE TABLE DOES NOT RECORD, for a fixture not known red,
          # refuses the run; the verdict says it, or it would be the one refusal
          # nobody reads.
          if grep -q '^row baseline, rows:' suite.log; then
            echo "UNEXPECTED $(grep '^row baseline, rows:' suite.log | cut -c1-300)" >> verdict.txt; unexpected=$((unexpected+1))
          fi
          echo "fixtures not green: $(grep -c '^RED ' suite.log); unexpected: $unexpected" >> verdict.txt
          # VOID ROWS ARE NOT GREEN ROWS: the runner's count, named by fixture.
          grep '^void rows:' suite.log >> verdict.txt || echo "void rows: no line (the runner of this tree does not count them)" >> verdict.txt
          cat verdict.txt
          [ "$unexpected" = 0 ] || exit 1
      - name: keep the readings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-${{ matrix.runner }}-${{ env.REF }}
          path: |
            out
            suite.log
            suite.rc
            verdict.txt
            rerun
