# The core's whole suite on macOS x86_64 (Intel hardware, macos-15-intel),
# from source. The tree it tests is the commit named in
# .github/intel-suite.ref, not this branch's own; igropyr is pinned beside
# it. Chez Scheme 10.4.1 is built from its release source, so the machine
# type is ta6osx. Two more jobs run one reading (init, insert, outline):
# on the base (.github/intel-suite.base), which refuses Darwin x86_64 for
# want of a row, and on a control (.github/intel-suite.rowonly) that adds
# the row without the $INODE64 symbols, where the legacy struct stat is
# read with the row's offsets. Nothing is written back; no secrets.
name: intel-suite

on:
  push:
    branches: [intel-suite]
  workflow_dispatch:

permissions:
  contents: read

env:
  CHEZ_VERSION: 10.4.1
  # NO LIBUV PATH IS GIVEN BY HAND: igropyr 1.8.2 (tag, 1ef294c) names
  # libuv's candidate paths under both Homebrew prefixes, so this is an
  # acceptance run on an Intel runner, whose Homebrew is under /usr/local,
  # with nothing set for it. (Run 36900889224 put /usr/local/lib on dyld's
  # fallback path; 37001139992 ran igropyr 3ed1972 with nothing set.)
  IGROPYR_REV: 1ef294c261121e6f98c8e8f500c90ac2aae5edc9

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        which: [ref, base, rowonly]
    runs-on: macos-15-intel
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - name: the tree under test
        run: |
          echo "REF=$(cat harness/.github/intel-suite.${{ matrix.which }})" >> "$GITHUB_ENV"
          cat harness/.github/intel-suite.${{ matrix.which }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
          path: lib/theourgia
      - uses: actions/checkout@v4
        with:
          repository: guenchi/Igropyr
          ref: ${{ env.IGROPYR_REV }}
          path: lib/igropyr
      - name: libuv and OpenSSL
        run: brew install libuv openssl@3
      - name: Chez Scheme ${{ env.CHEZ_VERSION }}
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL "https://github.com/cisco/ChezScheme/releases/download/v${CHEZ_VERSION}/csv${CHEZ_VERSION}.tar.gz" | tar -xz
          cd "csv${CHEZ_VERSION}"
          ./configure --threads --disable-x11 --disable-curses > "$RUNNER_TEMP/chez-configure.log"
          make -j"$(getconf _NPROCESSORS_ONLN)" > "$RUNNER_TEMP/chez-make.log" 2>&1
          sudo make install > "$RUNNER_TEMP/chez-install.log" 2>&1
      - name: what this run is on
        run: |
          uname -a; sw_vers; sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          scheme --version
          echo '(display (machine-type))' | scheme -q; echo
          git -C lib/theourgia rev-parse HEAD
          git -C lib/igropyr rev-parse HEAD
          rm -rf lib/theourgia/.git lib/igropyr/.git
          echo "so files: $(find lib -name '*.so' | wc -l)"
      # THE ROW ON INTEL HARDWARE: the probe compiled here and run, compared
      # with the row read under Rosetta, every line but machine and release.
      - name: the layout probe on this machine
        if: matrix.which == 'ref'
        run: |
          set +e
          mkdir -p probe
          cc -O0 -o probe/layout lib/theourgia/test/probe/layout.c
          ./probe/layout > probe/layout-intel.txt; echo $? > probe/layout.rc
          sed -E 's/ *\(release "[^"]*"\)//; s/\(machine "[^"]*"\) *//' probe/layout-intel.txt > probe/intel.cmp
          sed -E 's/ *\(release "[^"]*"\)//; s/\(machine "[^"]*"\) *//' lib/theourgia/test/probe/readings/darwin-x86_64-rosetta.sexp > probe/rosetta.cmp
          diff probe/rosetta.cmp probe/intel.cmp > probe/layout.diff; echo $? > probe/layout-diff.rc
          echo "probe rc $(cat probe/layout.rc), lines $(wc -l < probe/layout-intel.txt), diff rc $(cat probe/layout-diff.rc)"
          head -3 probe/layout-intel.txt; cat probe/layout.diff
          [ "$(cat probe/layout.rc)" = 0 ] && [ "$(cat probe/layout-diff.rc)" = 0 ] && [ -s probe/intel.cmp ]
      # X1: init, insert and outline on this machine, each status kept (the
      # step runs with errexit off: a refusal is a reading, not the end of
      # the step), then judged against what this job's tree should answer:
      #   ref      all three rc 0, and the outline names X1;
      #   base     init refused platform-unmeasured, exit 75 (no row);
      #   rowonly  the row without the symbols: init or insert answers a
      #            refusal carrying (errno 17), the legacy struct stat read
      #            with the row's offsets.
      - name: init then insert
        run: |
          set +e
          W="$PWD"; mkdir -p "$W/x1"; S="$(mktemp -d /tmp/x1.XXXXXX)/s"
          export THEOURGIA_LIBDIR="$W/lib" THEOURGIA_SCHEME=scheme
          export CHEZSCHEMELIBDIRS="$W/lib" CHEZSCHEMELIBEXTS=".sc::.sls::.scm"
          scheme --script lib/theourgia/theourgia.sc init --store "$S" > x1/init.out 2> x1/init.err; echo $? > x1/init.rc
          scheme --script lib/theourgia/theourgia.sc insert --title X1 --store "$S" > x1/insert.out 2> x1/insert.err; echo $? > x1/insert.rc
          scheme --script lib/theourgia/theourgia.sc outline --wire --store "$S" > x1/outline.out 2> x1/outline.err; echo $? > x1/outline.rc
          for f in init insert outline; do echo "== $f rc $(cat x1/$f.rc)"; head -c 2000 x1/$f.out; head -c 2000 x1/$f.err; done
          pkill -f theourgiad.sc
          r() { cat "x1/$1.rc"; }
          case "${{ matrix.which }}" in
            ref) [ "$(r init)" = 0 ] && [ "$(r insert)" = 0 ] && [ "$(r outline)" = 0 ] && grep -q 'X1' x1/outline.out ;;
            base) [ "$(r init)" = 75 ] && grep -q 'platform-unmeasured' x1/init.err ;;
            rowonly) ! { [ "$(r init)" = 0 ] && [ "$(r insert)" = 0 ]; } && cat x1/init.out x1/init.err x1/insert.out x1/insert.err | grep -q '(errno 17)' ;;
            *) false ;;
          esac
          v=$?
          echo "X1 ${{ matrix.which }}: $([ $v = 0 ] && echo as-predicted || echo NOT-AS-PREDICTED)" | tee x1/verdict.txt
          # WHAT A DAEMON THAT DID NOT START SAID: every serve.log under the
          # run directory, then the daemon once in the foreground on the
          # same store for ten seconds, its own stdout and stderr kept.
          mkdir -p x1/run
          for f in "$HOME"/.theourgia/run/*/serve.log; do [ -f "$f" ] && { echo "== $f"; cat "$f"; cp "$f" "x1/run/$(basename "$(dirname "$f")").serve.log"; }; done
          perl -e 'alarm 10; exec @ARGV' scheme --script lib/theourgia/theourgiad.sc serve "$S" > x1/foreground.out 2> x1/foreground.err; echo $? > x1/foreground.rc
          echo "== foreground daemon rc $(cat x1/foreground.rc)"; head -c 4000 x1/foreground.out; head -c 4000 x1/foreground.err
          pkill -f theourgiad.sc
          exit $v
      - name: the whole suite
        if: always() && matrix.which == 'ref'
        run: |
          set +e
          W="$PWD"; mkdir -p "$W/out" "$W/testroot"
          cd lib/theourgia/test
          ( export THEOURGIA_LIBDIR="$W/lib" THEOURGIA_TEST_ROOT="$W/testroot"; . ./env.sh
            sh run-fixtures.sh "$W/out" > "$W/suite.log" 2>&1; echo $? > "$W/suite.rc" ) || true
          cd "$W"
          echo "suite rc: $(cat suite.rc)"
          tail -80 suite.log
          # EACH NOT-GREEN FIXTURE AGAIN, ALONE: fresh roots, a 900 s limit,
          # outside the runner (no launch.pl, no process census). This is
          # evidence for the classification, not the classification: a
          # fixture that passes alone and failed in the suite is reported as
          # intermittent, and its cause is read from its own output.
          mkdir -p "$W/rerun"
          for fx in $(grep '^RED ' suite.log | awk '{print $2}'); do
            f="$W/lib/theourgia/test/$fx.sc"; runner="scheme --script"
            [ -f "$f" ] || { f="$W/lib/theourgia/test/$fx.py"; runner="python3"; }
            root=$(mktemp -d "$W/testroot/rerun.XXXXXX"); sock=$(mktemp -d /tmp/ths.XXXXXX)
            ( cd "$W/lib/theourgia/test"; export THEOURGIA_LIBDIR="$W/lib" THEOURGIA_TEST_ROOT="$root" THEOURGIA_TEST_SOCK="$sock"; . ./env.sh
              perl -e 'alarm 900; exec @ARGV' $runner "$f" > "$W/rerun/$fx.out" 2>&1 < /dev/null; echo $? > "$W/rerun/$fx.rc" ) || true
            echo "rerun $fx rc=$(cat "$W/rerun/$fx.rc") fail=$(grep -c '^FAIL' "$W/rerun/$fx.out") mismatch=$(grep -c 'MISMATCH' "$W/rerun/$fx.out") exception=$(grep -c -i 'exception' "$W/rerun/$fx.out") sentinel=$(grep -c "^$fx complete" "$W/rerun/$fx.out")"
          done
          # THE SUITE MUST HAVE RUN TO ITS END: a run that stopped before its
          # summary has no RED lines to rerun and would otherwise read clean.
          grep -q 'fixtures run:' suite.log || { echo "the suite printed no summary: it did not run to its end"; exit 1; }
          [ "$(cat suite.rc)" = 0 ] || { echo "suite rc $(cat suite.rc): not green, see RED lines and reruns"; exit 1; }
      - name: keep the readings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intel-suite-${{ matrix.which }}-${{ env.REF }}
          path: |
            probe
            x1
            out
            suite.log
            suite.rc
            rerun
