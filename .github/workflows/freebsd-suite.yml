# The core's whole suite on FreeBSD 15.0, from source, in a VM. The tree it
# tests is the commit named in .github/freebsd-suite.ref, not this branch's
# own; igropyr is pinned beside it. It runs the suite as an unprivileged
# user (root reads files a test makes unreadable), writes nothing back to the
# repository, uses no secrets, and uploads the whole output directory.
name: freebsd-suite

on:
  push:
    branches: [freebsd-suite]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - name: the tree under test
        run: |
          echo "REF=$(cat harness/.github/freebsd-suite.ref)" >> "$GITHUB_ENV"
          cat harness/.github/freebsd-suite.ref
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
          path: lib/theourgia
      - uses: actions/checkout@v4
        with:
          repository: guenchi/Igropyr
          ref: 56ca0db9c8bb1c32bafa1e1472852a6186ada31b
          path: lib/igropyr
      - uses: actions/checkout@v4
        with:
          ref: c01a8468d43ea8b7e4b4d1db29e0b91d436608dc
          path: probe/theourgia
      - uses: actions/checkout@v4
        with:
          repository: guenchi/Igropyr
          ref: 8db79ad78fedcc4accac7435b582e478418dafc8
          path: probe/igropyr
      - name: the suite on FreeBSD 15.0
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          usesh: true
          mem: 8192
          envs: 'REF'
          prepare: |
            mkdir -p /usr/local/etc/pkg/repos
            grep -h -A3 "FreeBSD-ports" /etc/pkg/FreeBSD.conf /usr/local/etc/pkg/repos/*.conf 2>/dev/null | head -20
            printf 'FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/quarterly", mirror_type: "srv" }\n' > /usr/local/etc/pkg/repos/zz-quarterly.conf
            pkg update -f
            pkg install -y chez-scheme libuv perl5 python3 git node bash
            pw useradd tester -m -s /bin/sh
          run: |
            set -x
            freebsd-version; uname -a; sysctl hw.ncpu hw.physmem
            command -v scheme || ln -s "$(command -v chez-scheme)" /usr/local/bin/scheme
            scheme --version
            pkg info chez-scheme libuv
            W="$(pwd)"
            rm -rf lib/theourgia/.git lib/igropyr/.git
            echo "so files: $(find lib -name '*.so' | wc -l)"
            mkdir -p "$W/out" "$W/testroot"
            chown -R tester "$W"
            id tester; sysctl security.bsd.see_other_uids security.bsd.see_other_gids security.bsd.see_jail_proc 2>&1
            printf '%s\n' 'echo "me $$"' 'ps -A -ww -o pid=,pgid=,stat=,command= | wc -l' 'ps -A -ww -o pid=,pgid=,stat=,command= | awk -v p=$$ "\$1==p"' 'ps -ww -o pid=,pgid=,stat=,command= -p $$' 'ps -A -o user= | sort | uniq -c' > /tmp/diag.sh
            su -m tester -c 'sh /tmp/diag.sh'
            ps -A -ww -o pid=,pgid=,stat=,command= | tail -5
            # THE PRINTER ON THIS CHEZ: the archived corpus's theourgia (c01a846)
            # and igropyr (8db79ad) files, in the archive's order, through the
            # probe; each <k>.txt is compared by index with the 10.1.0 reading.
            mkdir -p "$W/printout"; chown tester "$W/printout"
            cut -d' ' -f2 harness/.github/printprobe-subset.txt | sed "s#^#$W/probe/#" > "$W/printprobe-corpus.txt"
            su -m tester -c "scheme --script $W/lib/theourgia/test/probe/printprobe.ss $W/printout < $W/printprobe-corpus.txt > $W/printprobe-index.txt 2> $W/printprobe.err" || true
            (cd "$W/printout" && md5 -r *.txt) > "$W/printprobe.md5"
            echo "printprobe: $(wc -l < "$W/printprobe-index.txt") files, $(wc -l < "$W/printprobe.md5") outputs"; tail -3 "$W/printprobe.err"
            cd lib/theourgia/test
            su -m tester -c "HOME=/home/tester THEOURGIA_LIBDIR=$W/lib THEOURGIA_TEST_ROOT=$W/testroot; export HOME THEOURGIA_LIBDIR THEOURGIA_TEST_ROOT; . ./env.sh; sh run-fixtures.sh $W/out > $W/suite.log 2>&1; echo \$? > $W/suite.rc" || true
            cd "$W"
            echo "suite rc: $(cat suite.rc)"
            tail -80 suite.log
      - name: keep the readings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-suite-${{ env.REF }}
          path: |
            out
            suite.log
            suite.rc
            printprobe.md5
            printprobe-index.txt
            printprobe.err
