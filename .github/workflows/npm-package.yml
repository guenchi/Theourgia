# The npm package, installed and used where it will be published for:
# Linux on x86_64 and aarch64 (Chez 10.4.1 built from its release source,
# since distribution packages are older) and macOS on arm64 (Homebrew's
# chezscheme). Each job assembles vendor/, packs, installs the tarball
# globally into a scratch prefix, runs init, insert and outline, and asks
# the MCP shell for initialize. It publishes nothing and uses no secrets.
name: npm-package

on:
  push:
    branches: [npm, npm-check-*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chez and libuv (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libuv1 libncurses-dev uuid-dev
          curl -fsSL -o csv.tar.gz https://github.com/cisco/ChezScheme/releases/download/v10.4.1/csv10.4.1.tar.gz
          tar -xzf csv.tar.gz
          cd csv10.4.1
          ./configure --threads --disable-x11 --installprefix=/usr/local > ../chez-configure.log
          make -j"$(nproc)" > ../chez-make.log 2>&1
          sudo make install > ../chez-install.log 2>&1
          scheme --version
      - name: Chez and libuv (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install chezscheme libuv
          command -v chez scheme chezscheme || true
      - name: assemble, pack, install, use
        run: |
          set -x
          R="$RUNNER_TEMP/readings"; mkdir -p "$R"
          uname -a | tee "$R/platform.txt"; node --version | tee -a "$R/platform.txt"
          sh scripts/assemble.sh 2> "$R/assemble.err"; cat "$R/assemble.err"
          npm pack > "$R/pack.out"
          export HOME="$RUNNER_TEMP/home" XDG_CACHE_HOME="$RUNNER_TEMP/cache"
          mkdir -p "$HOME"
          npm install -g --foreground-scripts --prefix "$RUNNER_TEMP/prefix" ./theourgia-1.0.0.tgz > "$R/install.out" 2> "$R/install.err"
          echo "install rc $?" | tee "$R/N2.txt"; cat "$R/install.err"
          T="$RUNNER_TEMP/prefix/bin"
          "$T/theourgia" init --store "$RUNNER_TEMP/s" > "$R/init.out" 2> "$R/init.err"; echo "init rc $?" >> "$R/N2.txt"
          "$T/theourgia" insert --title N10-MARKER --store "$RUNNER_TEMP/s" > "$R/insert.out" 2> "$R/insert.err"; echo "insert rc $?" >> "$R/N2.txt"
          "$T/theourgia" outline --store "$RUNNER_TEMP/s" > "$R/outline.out" 2> "$R/outline.err"; echo "outline rc $?" >> "$R/N2.txt"
          echo "outline has the block: $(grep -c N10-MARKER "$R/outline.out")" >> "$R/N2.txt"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"n10","version":"0"}}}' \
            | "$T/theourgia-mcp" --store "$RUNNER_TEMP/s" > "$R/mcp.out" 2> "$R/mcp.err"
          echo "mcp rc $?" > "$R/N6.txt"
          node -e 'const ls=require("fs").readFileSync(process.argv[1],"utf8").split("\n").filter(Boolean); let ok=ls.length===1; try { const d=JSON.parse(ls[0]); ok = ok && d.id===1 && !!d.result; } catch (e) { ok=false; } console.log("stdout lines " + ls.length + ", one initialize result: " + ok);' "$R/mcp.out" >> "$R/N6.txt"
          pkill -f "theourgiad.sc serve $RUNNER_TEMP" || true
          cat "$R/N2.txt" "$R/N6.txt"
          grep -q "outline has the block: 1" "$R/N2.txt" && grep -q "one initialize result: true" "$R/N6.txt"
      - name: keep the readings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ matrix.os }}
          path: ${{ runner.temp }}/readings
