<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Theourgia Intro</title>
<style>
:root{
  --bg:#fbfaf7;--bg2:#f3f1ea;--panel:#ffffff;--line:#e4e0d5;--fg:#1c1b18;--dim:#6a655c;--com:#8a857a;
  --acc:#12b09c;--acc2:#0d8a7a;--kw:#1a8f8f;--teal:#0f6f68;--gold:#9a6b12;--num:#8a4b12;--str:#0f6f3f;
  --red:#d2493a;--redbg:#fbe9e5;--orange:#e08a1e;--violet:#5b3fc4;--ink:#23211d;
  --sans:"Avenir Next","SF Pro Display",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);height:100%;overflow:hidden}
#wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:var(--sans);color:var(--fg);transform-origin:center center;flex:none}
.abs{position:absolute;left:0;top:0;will-change:transform,opacity}
.scene{position:absolute;inset:0;opacity:0}
.tag{position:absolute;left:120px;top:78px;font:600 22px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.tag.wall{color:var(--red)}.tag.feat{color:var(--acc2)}
.title{position:absolute;left:120px;top:112px;font:700 62px/1.1 var(--sans);letter-spacing:-.01em;white-space:nowrap}
/* building blocks */
.doc{background:var(--panel);border:2px solid var(--line);border-radius:18px;box-shadow:0 12px 40px rgba(60,50,30,.10);overflow:hidden}
.doc .hd{position:relative;z-index:1;height:54px;border-bottom:2px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 20px;font:600 22px var(--mono);color:var(--dim);background:var(--bg2)}
.doc .hd .dot{width:13px;height:13px;border-radius:50%;background:var(--line)}
.bar{height:14px;border-radius:7px;background:#e9e5da;margin:12px 0}
.h{font:700 26px var(--mono);color:var(--fg);margin:18px 0 6px}
.codebar{background:#f1efe7;border-radius:10px;padding:10px 14px;font:500 20px/1.5 var(--mono);color:var(--teal)}
.bot{position:absolute;width:120px;height:120px}
.bot .body{position:absolute;left:0;top:18px;width:120px;height:100px;border-radius:30px;background:var(--acc)}
.bot .eye{position:absolute;top:52px;width:18px;height:26px;border-radius:9px;background:#fff}
.bot .ant{position:absolute;left:56px;top:0;width:8px;height:22px;border-radius:4px;background:var(--acc)}
.bot .ant:after{content:"";position:absolute;left:-5px;top:-8px;width:18px;height:18px;border-radius:50%;background:inherit}
.bot .name{position:absolute;top:128px;left:-40px;width:200px;text-align:center;font:600 20px var(--mono);color:var(--dim)}
.chip{display:inline-block;padding:10px 18px;border-radius:12px;font:600 24px var(--mono);white-space:nowrap}
.toast{padding:12px 22px;border-radius:14px;font:700 26px var(--sans);white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.ok{background:#e3f6ef;color:var(--str);border:2px solid #9fd9c2}
.bad{background:var(--redbg);color:var(--red);border:2px solid #f0b3a8}
.term{background:#1e1d1a;border-radius:18px;box-shadow:0 16px 50px rgba(0,0,0,.25);color:#e8e4d8;font:500 25px/1.6 var(--mono);padding:28px 34px;overflow:hidden}
.term .p{color:var(--acc)}.term .k{color:#7fd6c9}.term .s{color:#e6c07b}.term .n{color:#f0a36b}.term .c{color:#8a857a}
.blk{position:absolute;background:var(--panel);border:2.5px solid var(--line);border-radius:16px;padding:14px 18px;box-shadow:0 8px 26px rgba(60,50,30,.10);white-space:nowrap}
.blk .id{font:600 16px var(--mono);color:var(--com)}
.blk .t{font:700 24px var(--sans);margin-top:4px}
.blk .k{font:700 15px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.bubble{position:absolute;background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px 20px;font:600 24px var(--sans);white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.lbl{font:700 17px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
svg.full{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
#ctl{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:12px 14px 10px;z-index:9;background:linear-gradient(rgba(28,27,24,0),rgba(28,27,24,.28))}
#ctl button{flex:none;width:34px;height:34px;border:0;border-radius:50%;background:#fff;color:#1c1b18;font:700 14px/34px var(--sans);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);opacity:0;transition:opacity .25s}
body:hover #ctl button,body.paused #ctl button,#ctl button:focus-visible{opacity:1}
#ctl{background-size:100% 0;transition:background-size .25s}
body:hover #ctl,body.paused #ctl{background-size:100% 100%}
#segs{flex:1;display:flex;gap:3px;height:14px;align-items:center;cursor:pointer}
.seg{position:relative;height:4px;border-radius:2px;background:rgba(28,27,24,.14);overflow:hidden;transition:height .15s}
#segs:hover .seg{height:8px}
.seg i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--acc)}
#stage{cursor:pointer}
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<div id="ctl"><button id="pp" aria-label="Pause">❚❚</button><div id="segs" role="slider" aria-label="Chapters"></div><button id="rs" aria-label="Restart">↺</button></div>
<script>
// ---------------------------------------------------------------------------
// Deterministic renderer: every frame is a pure function of t (seconds).
// window.seek(t) draws the frame at t; the player below only advances t.
// Embed with <iframe src="intro.html" style="aspect-ratio:16/9;width:100%;border:0">.
// URL parameter ?t=<seconds> starts at that time.
// ---------------------------------------------------------------------------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eo=x=>1-Math.pow(1-x,3);
const bk=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const P=(t,a,b,f=io)=>f(clamp((t-a)/(b-a)));
const L=(a,b,p)=>a+(b-a)*p;
const stage=document.getElementById('stage');
function el(html,parent){const d=document.createElement('div');d.innerHTML=html.trim();const n=d.firstChild;(parent||stage).appendChild(n);return n}
function S(n,{o,x=0,y=0,s=1,r=0,sx,sy}={}){
  if(o!==undefined)n.style.opacity=o;
  n.style.transform=`translate(${x}px,${y}px) scale(${sx??s},${sy??s}) rotate(${r}deg)`;
}
// pop-in: returns {o,s} for an element appearing at time a
const pop=(t,a,d=.45)=>{const p=clamp((t-a)/d);return{o:clamp(p*2.5),s:p<=0?.6:L(.6,1,bk(p))}};
const typed=(str,t,a,cps=28)=>str.slice(0,Math.max(0,Math.floor((t-a)*cps)));
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}

function botHTML(color,name,cls=''){return `<div class="bot ${cls}"><div class="ant" style="background:${color}"></div><div class="body" style="background:${color}"></div><div class="eye e1" style="left:30px"></div><div class="eye e2" style="left:72px"></div>${name?`<div class="name">${name}</div>`:''}</div>`}
// eyes: mood 0 = normal, 1 = sad (flattened), blink by t
function eyes(b,t,mood=0,look=0){
  const bl=((t*1.7)%3.1)<.12?.15:1;
  for(const e of b.querySelectorAll('.eye')){
    e.style.transform=`translate(${look*8}px,${mood*10}px) scaleY(${bl*(1-mood*.55)})`;
  }
}
function docHTML(name,w,h,inner){return `<div class="doc abs" style="width:${w}px;height:${h}px"><div class="hd"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span style="margin-left:10px">${name}</span></div><div class="in" style="padding:10px 26px">${inner||''}</div></div>`}
const bars=(n,ws=[92,80,86,64,90,72])=>Array.from({length:n},(_,i)=>`<div class="bar" style="width:${ws[i%ws.length]}%"></div>`).join('');

// ---------------------------------------------------------------------------
// Scene framework
// ---------------------------------------------------------------------------
const scenes=[];
function scene(o){scenes.push(o)}
const FADE=.45;

// ============================== INTRO ======================================
scene({dur:7, build(r){
  this.doc=el(docHTML('notes.md',560,520,`<div class="h" style="opacity:0" id="i-h">## Ideas</div><div id="i-lines"></div>`),r);
  this.lines=[];const box=this.doc.querySelector('#i-lines');
  for(let i=0;i<7;i++){const b=el(`<div class="bar" style="width:${[90,76,84,60,88,70,80][i]}%;transform-origin:left"></div>`,box);this.lines.push(b)}
  this.h=this.doc.querySelector('#i-h');
  // a text caret, not a mouse pointer: it rides the end of whatever is being written
  this.cursor=el(`<div class="abs" style="width:3px;height:28px;border-radius:1.5px;background:var(--fg)"></div>`,r);
  this.heart=el(`<div class="abs" style="font:700 30px var(--sans);color:var(--acc2)">Easy for humans ✓</div>`,r);
  this.bots=[0,1,2].map(i=>el(botHTML(['#12b09c','#e08a1e','#5b3fc4'][i],''),r));
  const names=['Silent write errors','Concurrent overwrites','Token black hole','Long-tail sprawl','Drifting indexes'];
  this.walls=names.map((n,i)=>el(`<div class="abs" style="width:300px;height:92px;border-radius:14px;background:#fff;border:3px solid var(--red);display:flex;align-items:center;gap:14px;padding:0 18px;box-shadow:0 10px 26px rgba(210,73,58,.18)"><span style="font:800 34px var(--mono);color:var(--red)">${i+1}</span><span style="font:700 23px/1.15 var(--sans)">${n}</span></div>`,r));
  this.big=el(`<div class="abs" style="left:0;top:0;font:800 64px/1.1 var(--sans);letter-spacing:-.01em;width:1920px;text-align:center"></div>`,r);
},update(t){
  S(this.big,{o:P(t,.1,.6)*(1-P(t,2.9,3.3)),y:108});
  this.big.innerHTML='Markdown is great for humans…';
  if(t>3.3){this.big.innerHTML='…but agents keep hitting <span style="color:var(--red)">five walls</span>';S(this.big,{o:P(t,3.3,3.8),y:108})}
  const dx=L(680,300,P(t,3,4));
  S(this.doc,{o:P(t,.2,.7),x:dx,y:280});
  this.h.style.opacity=P(t,.6,.9);
  this.lines.forEach((b,i)=>{const a=.9+i*.22;b.style.transform=`scaleX(${P(t,a,a+.25,eo)})`});
  // caret after the heading, then at the growing end of the line being written; solid while typing, blinking at rest
  const hr=this.h.getBoundingClientRect(),rg=document.createRange();rg.selectNodeContents(this.h);
  // the heading is a block, so measure the text itself (in layout px, undoing the stage's display scale)
  const textW=hr.width?rg.getBoundingClientRect().width/hr.width*this.h.offsetWidth:0;
  let cx=this.h.offsetLeft+textW+6,cy=this.h.offsetTop+this.h.offsetHeight/2,typing=t>.6&&t<.9;
  this.lines.forEach((b,i)=>{const a=.9+i*.22;if(t>=a){const q=P(t,a,a+.25,eo);cx=b.offsetLeft+b.offsetWidth*q+6;cy=b.offsetTop+b.offsetHeight/2;if(q<1)typing=true}});
  const blink=typing||((t*2.2)%1)<.55?1:0;
  S(this.cursor,{o:P(t,.3,.5)*(1-P(t,2.8,3.1))*blink,x:dx+cx,y:280+cy-14});
  S(this.heart,{o:P(t,2.2,2.6)*(1-P(t,3,3.3)),x:760,y:840});
  this.bots.forEach((b,i)=>{S(b,{o:P(t,3.2+i*.15,3.6+i*.15),x:L(2000,1500+i*140,P(t,3.2+i*.15,3.9+i*.15,eo)),y:440+(i%2)*120});eyes(b,t+i,0,-1)});
  this.walls.forEach((w,i)=>{const a=3.9+i*.32;const p=P(t,a,a+.4,eo);S(w,{o:clamp(p*3),x:1000+(i%2)*40,y:L(-200,262+i*108,p),r:L(-12,(i%2?1.5:-1.5),p)})});
  const shake=t>4&&t<5.9?Math.sin(t*60)*3*(1-P(t,4,5.9)):0;
  this.doc.style.marginLeft=shake+'px';
}});

// ============================== WALL 1 =====================================
scene({tag:['wall','Wall 1 / 5'],title:'Silent write errors',dur:7,build(r){
  this.doc=el(docHTML('design.md',620,560,`
    <div class="h">## Goals</div>${bars(2)}
    <div class="sec" style="overflow:hidden;border-radius:10px"><div class="h" style="color:var(--acc2)">## Design</div>${bars(3,[88,70,80])}</div>
    <div class="ghost" style="height:0;overflow:hidden;opacity:0"><div style="height:60px;margin-top:10px;border:3px dashed var(--red);border-radius:12px;display:flex;align-items:center;justify-content:center;font:700 23px var(--sans);color:var(--red);background:rgba(251,233,229,.7)">“## Design” — gone. No error.</div></div>
    <div class="h">## API</div><div class="codebar">(define (retry thunk n)<br>&nbsp;&nbsp;…)</div>`),r);
  this.sec=this.doc.querySelector('.sec');this.secH=this.sec.scrollHeight||190;
  this.ghost=this.doc.querySelector('.ghost');
  this.bot=el(botHTML('#12b09c','agent'),r);
  this.patch=el(`<div class="abs chip" style="background:#fff;border:2px solid var(--acc);color:var(--acc2)">patch.diff</div>`,r);
  this.toast=el(`<div class="abs toast ok">✓ write succeeded</div>`,r);
  this.meter=el(`<div class="abs" style="width:460px"><div class="lbl">tokens spent</div><div style="margin-top:10px;height:34px;border-radius:17px;background:var(--bg2);border:2px solid var(--line);overflow:hidden"><div class="fill" style="height:100%;width:0;background:var(--acc)"></div></div><div class="m" style="margin-top:12px;font:700 26px var(--sans)"></div></div>`,r);
  this.fill=this.meter.querySelector('.fill');this.m=this.meter.querySelector('.m');
},update(t){
  S(this.doc,{o:P(t,0,.4),x:260,y:250});
  S(this.bot,{o:P(t,.2,.6),x:1320,y:330});eyes(this.bot,t,0,-1);
  const pp=P(t,1,1.9);S(this.patch,{o:P(t,.9,1.1)*(1-P(t,1.8,2)),x:L(1260,760,pp),y:L(390,470,pp)-Math.sin(pp*Math.PI)*90});
  const c=P(t,2,2.7);this.sec.style.height=(this.secH*(1-c))+'px';this.sec.style.opacity=1-c;
  S(this.toast,{...pop(t,2.7),x:1000,y:560});this.toast.style.opacity=pop(t,2.7).o*(1-P(t,6.6,7));
  const g=P(t,3.2,3.7);this.ghost.style.height=(g*70)+'px';this.ghost.style.opacity=g;
  const w=t<4.2?0:(t<5?L(0,48,P(t,4.2,5)):L(48,96,P(t,5.2,6.2)));
  S(this.meter,{o:P(t,4,4.3),x:1200,y:680});
  this.fill.style.width=w+'%';this.fill.style.background=w>60?'var(--red)':'var(--acc)';
  this.m.innerHTML=t<5.2?'write':'write + <span style="color:var(--red)">re-read to verify = ×2</span>';
}});

// ============================== WALL 2 =====================================
scene({tag:['wall','Wall 2 / 5'],title:'Concurrent overwrites',dur:6.5,build(r){
  this.doc=el(docHTML('policy.md',640,380,`<div class="h">## Retry rule</div><div class="para" style="position:relative;height:70px;margin-top:14px"></div>${bars(2)}`),r);
  this.para=this.doc.querySelector('.para');
  const ws=[['#12b09c','agent-a','Retry 3 times'],['#e08a1e','agent-b','Retry 5 times'],['#5b3fc4','you','Never retry']];
  this.ws=ws.map(([c,n,txt])=>({c,n,txt,bot:el(botHTML(c,n),r),chip:el(`<div class="abs chip" style="background:#fff;border:2.5px solid ${c};color:${c}">${txt}</div>`,r),line:el(`<div style="position:absolute;left:0;top:0;font:700 34px var(--sans);color:${c};white-space:nowrap">${txt}<span class="st" style="position:absolute;left:0;top:50%;height:4px;background:var(--red);width:0"></span></div>`,this.para)}));
  this.lost=el(`<div class="abs toast bad">Lost work: 0 edits</div>`,r);
},update(t){
  S(this.doc,{o:P(t,0,.4),x:640,y:300});
  const pos=[[240,300],[1600,300],[900,760]];
  const saves=[1.2,2.8,4.4];
  this.ws.forEach((w,i)=>{
    const [bx,by]=pos[i];
    S(w.bot,{o:P(t,.2+i*.1,.6+i*.1),x:bx,y:by});
    const lost=i<2&&t>saves[i+1]+.3;
    eyes(w.bot,t+i,lost?1:0,i==1?-1:(i==0?1:0));
    const p=P(t,saves[i]-.9,saves[i]);
    const tx=690,ty=440;
    S(w.chip,{o:P(t,saves[i]-1,saves[i]-.8)*(1-P(t,saves[i]-.05,saves[i])),x:L(bx+(i==1?-120:0),tx,p),y:L(by+(i==2?-60:150),ty,p)});
    const vis=t>saves[i]?(i<2?1-P(t,saves[i+1]+.3,saves[i+1]+.7):1):0;
    S(w.line,{o:vis,y:i<2&&t>saves[i+1]?L(0,-10,P(t,saves[i+1],saves[i+1]+.5)):0});
    w.line.querySelector('.st').style.width=(i<2?P(t,saves[i+1],saves[i+1]+.3)*100:0)+'%';
  });
  const n=(t>saves[1]+.3?1:0)+(t>saves[2]+.3?1:0);
  this.lost.textContent=`Lost work: ${n} edit${n==1?'':'s'}`;
  S(this.lost,{o:P(t,3.1,3.4),x:1360,y:660,s:1+(n==2?.12*(1-P(t,4.7,5.1)):0)});
}});

// ============================== WALL 3 =====================================
scene({tag:['wall','Wall 3 / 5'],title:'The token black hole',dur:6.5,build(r){
  let inner='';for(let i=0;i<40;i++){inner+= i==17?`<div class="rule" style="margin:10px 0;padding:6px 10px;border-radius:8px;background:#fff4d6;border:2px solid var(--gold);font:700 21px var(--mono);color:var(--gold)">rule 47: timeouts are 30s</div>`:`<div class="bar" style="width:${[92,70,84,60,88,76,66][i%7]}%"></div>`}
  this.doc=el(docHTML('handbook.md',520,620,`<div class="scroll">${inner}</div>`),r);
  this.scroll=this.doc.querySelector('.scroll');
  this.cnt=el(`<div class="abs" style="font:700 26px var(--mono)"></div>`,r);
  this.bot=el(botHTML('#12b09c','agent'),r);
  this.q=el(`<div class="bubble">What's the timeout rule?</div>`,r);
  this.win=el(`<div class="abs" style="width:150px;height:430px;border:3px solid var(--fg);border-radius:18px;overflow:hidden;background:#fff"><div class="f" style="position:absolute;left:0;right:0;bottom:0;height:0;background:var(--red)"></div></div>`,r);
  this.winF=this.win.querySelector('.f');
  this.winL=el(`<div class="abs lbl" style="width:220px;text-align:center">context window</div>`,r);
  this.flies=Array.from({length:14},()=>el(`<div class="abs" style="width:120px;height:12px;border-radius:6px;background:#d9d3c4"></div>`,r));
  this.stat=el(`<div class="abs" style="font:700 30px/1.5 var(--sans)"><div>Needed: <span style="color:var(--acc2)">1 line</span></div><div>Read: <span style="color:var(--red)">4,812 lines</span></div></div>`,r);
},update(t){
  S(this.doc,{o:P(t,0,.4)*(1-P(t,3,3.6)*.65),x:240,y:250,s:1-P(t,3,3.8)*.1});
  this.scroll.style.transform=`translateY(${-L(0,420,P(t,.3,2.6))}px)`;
  const added=Math.floor(L(3200,4811,P(t,.3,2.6,x=>x)));
  S(this.cnt,{o:P(t,.3,.6),x:260,y:885-10});this.cnt.style.top='-12px';
  this.cnt.innerHTML=`<span style="color:var(--str)">+${added.toLocaleString('en')} lines</span> · <span style="color:var(--red)">−0</span>`;
  S(this.bot,{o:P(t,.2,.5),x:1080,y:380});eyes(this.bot,t,t>5?1:0,-1);
  S(this.q,{...pop(t,1),x:1000,y:250});this.q.style.opacity=pop(t,1).o*(1-P(t,3,3.3));
  S(this.win,{o:P(t,.4,.7),x:1400,y:300});S(this.winL,{o:P(t,.4,.7),x:1365,y:750});
  this.flies.forEach((f,i)=>{const a=3+i*.1;const p=P(t,a,a+.6,io);S(f,{o:p>0&&p<1?1:0,x:L(300+(i%3)*110,1415,p),y:L(300+i*40,640-i*18,p)-Math.sin(p*Math.PI)*330,s:L(1,.6,p)})});
  const fp=P(t,3.1,4.8);this.winF.style.height=(fp*94)+'%';
  S(this.stat,{o:P(t,5,5.4),x:1600,y:420});
}});

// ============================== WALL 4 =====================================
scene({tag:['wall','Wall 4 / 5'],title:'Runaway long-tail sprawl',dur:6.5,build(r){
  const rnd=rng(7);

},update(t){
  const pos=(e,[x,y],o,s=1)=>S(e,{o,x,y,s});

  flights.forEach(([a,b,s0],i)=>{const g=this.ghost[i],p=P(t,s0,s0+.75);g.style.width=b[2]+'px';S(g,{o:p>0&&p<1?1:0,x:L(a[0],b[0],p),y:L(a[1],b[1],p)-Math.sin(p*Math.PI)*60})});
  // the terminal: scope, then collect
  const SC='$ theourgia scope scope-1\n    --cut review-1\n    --roots 2gc62due.1\n    --for codex',CO='$ theourgia collect scope-1';

  S(this.term,{o:P(t,.3,.6)*(t>10&&t<10.3?1-P(t,10,10.3):1),x:768,y:298});
  // the two sessions
  S(this.author,{o:P(t,.3,.6),x:370,y:880});eyes(this.author,t,0,1);

  // about edges: findings to the code copy, then (after collect) to the original block

    const g=this.edges.querySelector('.g'),lab=this.edges.querySelector('.lab');this.paths=[];
    const rect=(e,[x,y,w])=>({x,y,w,h:e.offsetHeight});
    const mk=(fe,fp,te,tp,a,bulge)=>{const F=rect(fe,fp),T=rect(te,tp);const x1=F.x+F.w,y1=F.y+F.h/2,x2=T.x+T.w+6,y2=T.y+T.h/2;
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M${x1} ${y1} C${x1+bulge} ${y1} ${x2+bulge} ${y2} ${x2} ${y2}`);p.setAttribute('marker-end','url(#a8)');g.appendChild(p);
      const tx=document.createElementNS('http://www.w3.org/2000/svg','text');tx.setAttribute('x',Math.max(x1,x2)+bulge*.75+6);tx.setAttribute('y',(y1+y2)/2+5);tx.textContent='about';lab.appendChild(tx);

    mk(this.m.f1,this.M.f1,this.m.code,this.M.code,13.6,46);mk(this.m.f2,this.M.f2,this.m.code,this.M.code,14.0,72);
  }

// ---------------------------------------------------------------------------
let T0=0;scenes.forEach(s=>{s.t0=T0;T0+=s.dur});
const TOTAL=T0;
scenes.forEach((s,i)=>{
  s.root=el(`<div class="scene"></div>`);
  if(s.tag){el(`<div class="tag ${s.tag[0]}">${s.tag[1]}</div>`,s.root);}
  if(s.title){s.tEl=el(`<div class="title">${s.title}</div>`,s.root);let fs=62;while(s.tEl.scrollWidth>1680&&fs>36){fs-=2;s.tEl.style.fontSize=fs+'px'}}
  s.build(s.root);
});
function seek(t){
  t=clamp(t,0,TOTAL);
  scenes.forEach(s=>{
    const lt=t-s.t0;
    if(lt<-FADE||lt>s.dur+FADE){s.root.style.display='none';return}
    s.root.style.display='block';
    const o=Math.min(clamp((lt+FADE)/FADE),clamp((s.dur+FADE-lt)/FADE));
    // first scene has no fade-in, last has no fade-out
    const oo=(s===scenes[0]&&lt<0)?0:(s===scenes[0]&&lt<FADE?1:(s===scenes[scenes.length-1]&&lt>s.dur-FADE?1:o));
    s.root.style.opacity=(s===scenes[0]&&lt>=0&&lt<s.dur-FADE)?1:oo;
    if(s.tEl)S(s.tEl,{o:P(lt,0,.5),x:L(-30,0,P(lt,0,.5,eo))});
    s.update(clamp(lt,0,s.dur));
  });
  segFill.forEach((f,i)=>{f.style.width=(clamp((t-scenes[i].t0)/scenes[i].dur)*100)+'%'});
}

// ---------------------------------------------------------------------------
// Player: fits the stage to the frame, advances t, and stops the clock while
// the tab is hidden or the player is scrolled out of view.
// ---------------------------------------------------------------------------
const segs=document.getElementById('segs');
const segFill=scenes.map(s=>{const d=el(`<div class="seg" style="flex:${s.dur}"><i></i></div>`,segs);return d.firstChild});
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`scale(${k})`}
addEventListener('resize',fit);fit();

const HOLD=2;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
// with reduced motion, open paused on the frame that names the product
const POSTER=scenes[6].t0+7;
let cur=+(new URLSearchParams(location.search).get('t'))||(reduce?POSTER:0);
let userPaused=reduce,visible=true,last=performance.now();
const pp=document.getElementById('pp');
function setPaused(v){userPaused=v;document.body.classList.toggle('paused',v);pp.textContent=v?'▶':'❚❚';pp.setAttribute('aria-label',v?'Play':'Pause')}
setPaused(userPaused);
pp.onclick=e=>{e.stopPropagation();setPaused(!userPaused)};
// framed in another page, a click on the picture opens the intro on its own
stage.onclick=window.top!==window.self?()=>{window.top.location.href=location.pathname}:()=>setPaused(!userPaused);
document.getElementById('rs').onclick=e=>{e.stopPropagation();cur=0;setPaused(false)};
segs.onclick=e=>{
  const r=segs.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*TOTAL;
  // a click jumps to the start of the chapter under the pointer
  const sc=scenes.find(s=>x>=s.t0&&x<s.t0+s.dur)||scenes[0];cur=sc.t0;seek(cur);
};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();setPaused(!userPaused)}});
if('IntersectionObserver' in window)new IntersectionObserver(es=>{visible=es[0].isIntersecting},{threshold:.2}).observe(stage);
(function loop(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(!userPaused&&visible&&!document.hidden){cur+=dt;if(cur>TOTAL+HOLD)cur=0;seek(cur)}
  requestAnimationFrame(loop);
})(performance.now());
window.seek=seek;window.TOTAL=TOTAL;
seek(cur);
</script>
